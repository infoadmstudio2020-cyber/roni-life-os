
<!DOCTYPE html>
<html lang="en">
<head>

          content="width=device-width, initial-scale=1.0,

    <div class="loading-section">

            <div class="loading-progress"></div>
        </div>

            INITIALIZING SYSTEM
        </p>

    </div>

    <div class="footer">
        <span>RONiLiFEOS</span>
