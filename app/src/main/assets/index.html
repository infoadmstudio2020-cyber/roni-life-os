<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="shortcut icon" href="assets/images/favicon.ico" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="RONi Android Library Project Generator & JitPack Manager (v0.1.3.6)" />
  <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F1F5F9" media="(prefers-color-scheme: light)" />
  <title>RONi Android LibGen v0.1.3.6</title>

  <!-- Apply persisted theme/language before first paint (no flash) -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('libgen.ui.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        } else if (theme === 'system') {
          document.documentElement.dataset.theme =
            window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var lang = localStorage.getItem('libgen.ui.language');
        if (lang === 'bn' || lang === 'en') document.documentElement.lang = lang;
      } catch (e) { /* storage unavailable — defaults apply */ }
    })();
  </script>

  <!-- Google Fonts (Montserrat + JetBrains Mono + Noto Sans Bengali for বাংলা) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- JSZip (Local vendor package for 100% offline usability with CDN fallback) -->
  <script src="js/vendor/jszip.min.js"></script>
  <script>
    if (typeof JSZip === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"><\/script>');
    }
  </script>

  <!-- ── CSS Design System ── -->
  <!-- Base -->
  <link rel="stylesheet" href="css/base/reset.css" />
  <link rel="stylesheet" href="css/base/variables.css" />
  <link rel="stylesheet" href="css/base/typography.css" />
  <link rel="stylesheet" href="css/base/utilities.css" />
  <!-- Layout -->
  <link rel="stylesheet" href="css/layout/app.css" />
  <link rel="stylesheet" href="css/layout/sidebar.css" />
  <link rel="stylesheet" href="css/layout/toolbar.css" />
  <link rel="stylesheet" href="css/layout/bottomnav.css" />
  <link rel="stylesheet" href="css/layout/console.css" />
  <link rel="stylesheet" href="css/layout/statusbar.css" />

  <!-- Components -->
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/inputs.css" />
  <link rel="stylesheet" href="css/components/tabs.css" />
  <link rel="stylesheet" href="css/components/cards.css" />
  <link rel="stylesheet" href="css/components/forms.css" />
  <link rel="stylesheet" href="css/components/modals.css" />
  <link rel="stylesheet" href="css/components/toasts.css" />
  <link rel="stylesheet" href="css/components/badges.css" />
  <link rel="stylesheet" href="css/components/explorer.css" />
  <link rel="stylesheet" href="css/components/editor.css" />
  <link rel="stylesheet" href="css/components/spinners.css" />
  <!-- Layout extras -->
  <link rel="stylesheet" href="css/layout/editor-area.css" />
  <!-- Pages -->
  <link rel="stylesheet" href="css/pages/dashboard.css" />
  <link rel="stylesheet" href="css/pages/generator.css" />
  <link rel="stylesheet" href="css/pages/settings.css" />
  <link rel="stylesheet" href="css/pages/github.css" />
  <link rel="stylesheet" href="css/pages/logs.css" />
  <link rel="stylesheet" href="css/pages/ghtesting.css" />
  <link rel="stylesheet" href="css/pages/gradle.css" />

<body>

<!-- ── App Shell ─────────────────────────────────────────────────────── -->
<div id="app">

  <!-- Toolbar -->
  <header id="toolbar" role="banner"></header>

  <!-- Main row: sidebar + content + property panel -->
  <div id="app-body">

    <!-- Left Sidebar -->
    <nav id="sidebar" role="navigation" aria-label="Main navigation"></nav>

    <!-- Center content area -->
    <main id="main-content" role="main" aria-live="polite"></main>

    <!-- Right property panel -->
    <aside id="property-panel" aria-label="File properties"></aside>

  </div>

  <!-- Bottom console -->
  <div id="console-panel" role="log" aria-label="Console output"></div>

  <!-- Status bar -->
  <footer id="status-bar" role="contentinfo"></footer>

  <!-- Bottom navigation (mobile only, hidden on tablet/desktop via CSS) -->
  <nav id="bottom-nav" role="navigation" aria-label="Main"></nav>

</div>

<!-- ── Context menu ──────────────────────────────────────────────────── -->
<div id="context-menu" class="context-menu" role="menu" aria-hidden="true"></div>

<!-- ── Modal layer ──────────────────────────────────────────────────── -->
<div id="modal-layer" role="dialog" aria-modal="true" aria-hidden="true"></div>

<!-- ── Toast layer ──────────────────────────────────────────────────── -->
<div id="toast-layer" role="status" aria-live="polite"></div>

<!-- ── Fatal error fallback ─────────────────────────────────────────── -->
<div id="app-error" style="display:none;position:fixed;inset:0;background:#0B0F19;color:#EF4444;
     font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;align-items:center;justify-content:center;z-index:9999;padding:32px;text-align:center">
</div>

<!-- ── Global Error Guard ────────────────────────────────────────────── -->
<script>
  function renderGlobalError(msg) {
    var el = document.getElementById('app-error');
    if (el && (!el.style.display || el.style.display === 'none')) {
      el.style.display = 'flex';
      el.style.flexDirection = 'column';
      el.style.gap = '12px';
      var isFile = window.location.protocol === 'file:';
      el.innerHTML = '<div style="font-size:20px;font-weight:700;color:#F87171">Application Startup Error</div>' +
        '<div style="color:#94A3B8;max-width:600px;line-height:1.6;font-family:monospace;background:#1E293B;padding:12px;border-radius:6px">' + (msg || 'Script failed to load') + '</div>' +
        (isFile ? '<div style="margin-top:12px;padding:12px 16px;background:#1E293B;border-radius:8px;color:#38BDF8;font-size:13px;max-width:560px;text-align:left;border-left:4px solid #38BDF8"><strong>Note for Android WebView / Local Viewing:</strong> Browsers and WebViews restrict JavaScript ES Modules when opened directly via <code>file://</code> protocol. In Android apps, use AndroidX <code>WebViewAssetLoader</code> to serve assets securely via <code>https://appassets.androidplatform.net/assets/index.html</code> (see <code>docs/android-webview-integration.md</code>). For desktop browsers, please serve this folder using a local web server (e.g. <code>npx serve</code>, VS Code Live Server, or <code>python3 -m http.server</code>).</div>' : '') +
        '<button onclick="location.reload()" style="margin-top:16px;background:#0284C7;color:#FFF;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500">Retry</button>';
    }
  }

  window.addEventListener('error', function (e) {
    renderGlobalError(e.message || (e.error && e.error.message) || 'Script failed to load');
  });

  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise Rejection';
    renderGlobalError(reason);
  });
</script>

<!-- ── App Bootstrap ─────────────────────────────────────────────────── -->
<script type="module" src="js/app.js"></script>

</body>
</html>
